
name: Extract ZIP and Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # Use v4 and explicitly avoid the obsolete tools package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Keep exactly one project ZIP in repository root."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_ROOT"

      - name: Check Build Environment
        run: |
          java -version
          gradle --version

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_ROOT/app/build/outputs/apk/debug"

          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-V6-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-Build-Error-Reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
