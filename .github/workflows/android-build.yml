
name: Extract ZIP and Build APK

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 4. Setup Android SDK and accept licences
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install required Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Find and extract uploaded ZIP
      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP file found."
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only one project ZIP in the repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "ERROR: App Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project extracted successfully."
          echo "Project directory: $PROJECT_ROOT"

      # 7. Check Java and Gradle
      - name: Check Build Environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 8. Build Android Debug APK
      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 9. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_ROOT/app/build/outputs/apk/debug"

          if ! ls "$APK_PATH"/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"/*.apk

      # 10. Upload APK
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-V6-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Upload error reports if build fails
      - name: Upload Build Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-Build-Error-Reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
