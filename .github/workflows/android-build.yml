
name: MediaBridge Studio V6 APK Build

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            -name settings.gradle -o \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_DIR")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-V6-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MediaBridgeStudio-Build-Errors
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

